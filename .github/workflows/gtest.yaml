# yamllint disable rule:line-length
name: gtest

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # this should be the name used in "Require status checks to pass"
  check-gtest:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/soblin/cpplox-devcontainer:latest

    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: bash
        run: |
          mkdir build
          cd build
          cmake .. -DTRACE_COVERAGE=ON -DUSE_LTO=ON
          make -j

      - name: Run Tests
        shell: bash
        env:
          CTEST_OUTPUT_ON_FAILURE: 1
        run: |
          cd build
          make test

      - name: Measure Coverage
        run: |
          cd build
          lcov --version
          lcov -c -d . -o lcov.info --gcov-tool ../test/llvm-gcov.sh --ignore-errors inconsistent
          lcov --remove lcov.info '/usr/*' --output-file lcov.info --ignore-errors inconsistent

      - name: Upload Coverage
        uses: codecov/codecov-action@v3
        with:
          file: build/lcov.info
          name: codecov-coverage
          token: ${{ secrets.CODECOV_TOKEN }}
